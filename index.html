<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FEDECOMPU ECUADOR</title>
<style>
body{font-family:Arial,sans-serif;background:#f0f4ff;margin:0;padding:0}
.header{background:linear-gradient(90deg,#0033A0 0%,#FFD100 100%);color:white;padding:25px;text-align:center}
.header h1{margin:0;font-size:32px}
.header p{margin:5px 0 0}
.container{max-width:450px;margin:40px auto;background:white;padding:30px;border-radius:15px;box-shadow:0 4px 15px rgba(0,0,0,0.1);border-top:5px solid #0033A0}
.container h2{color:#0033A0;text-align:center;margin-top:0}
label{font-weight:bold;color:#333;font-size:13px}
input{width:100%;padding:12px;margin:8px 0 15px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
button{width:100%;background:#0033A0;color:white;padding:13px;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer}
.footer{text-align:center;margin-top:20px;color:#777;font-size:12px}
</style>
</head>
<body>
<div class="header">
<h1>FEDECOMPU ECUADOR</h1>
<p>Acceso de Alumnos y Docentes</p>
</div>
<div class="container">
<h2>INGRESO</h2>
<label>CEDULA</label>
<input type="text" placeholder="Ingrese su cedula">
<label>CLAVE</label>
<input type="password" placeholder="Ingrese su clave">
<button>INGRESAR</button>
<div class="footer">© 2026 FEDECOMPU - Todos los derechos reservados</div>
</div>
</body>
</html>
