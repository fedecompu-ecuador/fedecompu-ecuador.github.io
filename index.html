<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FEDECOMPU ECUADOR</title>
<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background: linear-gradient(to bottom, #0a0a0a 0%, #1a8a3a 50%, #22c55e 100%);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.logo-area{
  margin-top:60px;
  text-align:center;
  color:white;
}
.logo-area h1{
  margin:0;
  font-size:32px;
  font-weight:800;
  letter-spacing:1px;
}
.logo-area h1 span{color:#22ff66;}
.logo-area h2{
  margin:5px 0 0;
  font-size:18px;
  letter-spacing:3px;
}
.logo-area p{
  margin:5px 0 0;
  font-size:11px;
  color:#7dd8a0;
  letter-spacing:1px;
}
.card{
  margin-top:40px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(10px);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:18px;
  padding:30px 25px;
  width:90%;
  max-width:380px;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
}
.card h3{
  color:white;
  text-align:center;
  margin:0 0 20px;
  font-size:20px;
}
input{
  width:100%;
  padding:14px 15px;
  margin-bottom:15px;
  border:none;
  border-radius:12px;
  background: rgba(0,0,0,0.35);
  color:white;
  font-size:14px;
  box-sizing:border-box;
  outline:none;
}
input::placeholder{color:#a0c0a8;}
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#86efac;
  color:#14532d;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
  letter-spacing:1px;
  margin-top:5px;
}
button:hover{background:#4ade80;}
.small{color:rgba(255,255,255,0.5);font-size:10px;text-align:center;margin-top:15px;}
</style>
</head>
<body>

<div class="logo-area">
  <div style="font-size:35px;">🎓</div>
  <h1>FEDE<span>COMPU</span></h1>
  <h2>ECUADOR</h2>
  <p>REGISTRO DE ESTUDIANTES</p>
</div>

<div class="card">
  <h3>🔓 Acceso Docente</h3>
  <input type="text" placeholder="CEDULA">
  <input type="password" placeholder="CLAVE">
  <button>INGRESAR</button>
  <div class="small">Apellido conectado con éxito...</div>
</div>

</body>
</html>
