<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FEDECOMPU ECUADOR</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(to bottom,#0a0a0a 0%,#15803d 50%,#22c55e 100%);min-height:100vh;display:flex;flex-direction:column;align-items:center}
.logo-area{margin-top:60px;text-align:center;color:white}
.logo-area h1{margin:0;font-size:32px;font-weight:800}
.logo-area h1 span{color:#4ade80}
.logo-area h2{margin:5px 0 0;font-size:18px;letter-spacing:3px}
.logo-area p{margin:5px 0 0;font-size:11px;color:#86efac}
.card{margin-top:40px;background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.1);border-radius:18px;padding:30px 25px;width:90%;max-width:380px}
.card h3{color:white;text-align:center;margin:0 0 20px}
input{width:100%;padding:14px;margin-bottom:15px;border:none;border-radius:12px;background:rgba(0,0,0,0.4);color:white;box-sizing:border-box;outline:none}
input::placeholder{color:#a0c0a8}
button{width:100%;padding:14px;border:none;border-radius:12px;background:#86efac;color:#14532d;font-weight:bold;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<div class="logo-area">
<div style="font-size:35px;">🎓</div>
<h1>FEDE<span>COMPU</span></h1>
<h2>ECUADOR</h2>
<p>REGISTRO DE ESTUDIANTES</p>
</div>

<div class="card">
<h3>🔓 Acceso Docente</h3>
<input id="cedula" type="text" placeholder="CEDULA">
<input id="clave" type="password" placeholder="CLAVE">
<button onclick="ingresar()">INGRESAR</button>
</div>

<script>
function ingresar(){
  var cedula = document.getElementById("cedula").value;
  var clave = document.getElementById("clave").value;
  
  if(cedula == "" || clave == ""){
    alert("Por favor ingrese su cédula y clave");
    return;
  }
  
  // Aquí es donde usted puede poner su cédula y clave correcta
  // Por ahora deja entrar a todos
  alert("¡Bienvenido! Ingresando con cédula: " + cedula);
  
  // Aquí le puede mandar a otra página, por ejemplo:
  // window.location.href = "panel.html";
}
</script>

</body>
</html>
