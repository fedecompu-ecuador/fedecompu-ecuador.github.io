<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FEDECOMPU - SISTEMA WEB 2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
body{background:#f0f2f5}
.login{max-width:400px;margin:80px auto;background:white;padding:30px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.login input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px}
.login button{width:100%;padding:12px;background:#1a3a5f;color:white;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
.header{background:#1a3a5f;color:white;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}
.horarios{display:flex;gap:6px;flex-wrap:wrap;padding:12px;background:white}
.horarios button{padding:8px 14px;border:1px solid #1a3a5f;background:white;border-radius:20px;cursor:pointer;font-weight:bold}
.horarios button.active{background:#1a3a5f;color:white}
.fechas-bar{background:#fff3cd;padding:12px;border-bottom:2px solid #ffc107;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fechas-bar input{width:100px;padding:6px;border:1px solid #ccc;border-radius:6px;font-size:12px}
.controls{padding:12px;background:white;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.controls button{padding:10px 18px;border:none;border-radius:8px;color:white;font-weight:bold;cursor:pointer}
.btn-add{background:#28a745}.btn-save{background:#007bff}.btn-excel{background:#198754}
.table-wrap{overflow:auto;background:white;margin:10px;border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:2600px;font-size:12px}
th{background:#1a3a5f;color:white;padding:8px;position:sticky;top:0}
td{border:1px solid #ddd;padding:4px;text-align:center}
td input,td select{width:100%;border:none;padding:4px;text-align:center;font-size:12px}
.fijo{text-align:left;min-width:160px;background:#f8f9fa}
</style>
</head>
<body>
<div id="loginBox" class="login">
<h2 style="text-align:center;color:#1a3a5f">FEDECOMPU<br>SISTEMA WEB 2026</h2><br>
<label>CEDULA</label>
<input id="user" value="0604772731">
<label>CLAVE</label>
<input id="pass" type="password" value="fedecompu2018">
<button onclick="login()">INGRESAR A MI SISTEMA</button>
<p id="msg" style="color:red;text-align:center;margin-top:10px"></p>
</div>

<div id="app" style="display:none">
<div class="header"><h1 id="tit">FEDECOMPU</h1><button onclick="location.reload()" style="background:#c0392b;color:white;border:none;padding:8px 14px;border-radius:6px;cursor:pointer">Salir</button></div>
<div class="horarios" id="horDiv"></div>
<div class="fechas-bar" id="fechasBar"><b>📅 24 FECHAS REALES (Ej: Sáb 15 Nov):</b></div>
<div class="controls">
<button class="btn-add" onclick="agregar()">+ AGREGAR ALUMNO</button>
<button class="btn-save" onclick="guardar()">💾 GUARDAR TODO</button>
<button class="btn-excel" onclick="exportar()">📊 EXPORTAR EXCEL</button>
<span id="estado" style="color:green;font-weight:bold"></span>
</div>
<div class="table-wrap"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div>
</div>

<script>
const HORARIOS=["SAB 8@10","SAB 10@12","SAB 12@2","SAB 2@4","DOM 8@10","DOM 10@12","DOM 12@2","DOM 2@4","SAB-DOM"];
let hAct="SAB 8@10"; let fechas=Array(24).fill("");
let alumnos=JSON.parse(localStorage.getItem("fede_final_2018")||"[]");
if(alumnos.length==0){
 alumnos=[
  {codigo:"001",apellidos:"EJEMPLO - JUAN PEREZ",cedula:"0600000001",telefono:"0990000001",direccion:"Riobamba",curso:"BASICO",horario:"SAB 8@10",semanas:Array(24).fill(0).map(()=>({fecha:"",asist:"",valor:""}))},
  {codigo:"002",apellidos:"EJEMPLO - MARIA LOPEZ",cedula:"0600000002",telefono:"0990000002",direccion:"Riobamba",curso:"BASICO",horario:"SAB 8@10",semanas:Array(24).fill(0).map(()=>({fecha:"",asist:"",valor:""}))}
 ];
}
function login(){
 if(user.value=="0604772731" && pass.value=="fedecompu2018"){
  loginBox.style.display="none";app.style.display="block";init();
 } else {
  msg.innerText="Cedula o clave incorrecta - Use 0604772731 / fedecompu2018";
 }
}
function init(){
 horDiv.innerHTML="";
 HORARIOS.forEach(h=>{
  let b=document.createElement("button");
  b.innerText=h+" ("+alumnos.filter(a=>a.horario==h).length+")";
  if(h==hAct) b.className="active";
  b.onclick=()=>{hAct=h;init()};
  horDiv.appendChild(b)
 });
 fechas=JSON.parse(localStorage.getItem("fechas_"+hAct)||JSON.stringify(Array(24).fill("")));
 fechasBar.innerHTML="<b>📅 24 FECHAS REALES (Ej: Sáb 15 Nov):</b>";
 for(let i=0;i<24;i++){
  let inp=document.createElement("input");
  inp.placeholder="Sem "+(i+1);
  inp.value=fechas[i]||"";
  inp.onchange=e=>{fechas[i]=e.target.value;localStorage.setItem("fechas_"+hAct,JSON.stringify(fechas));render()};
  fechasBar.appendChild(inp)
 }
 render()
}
function render(){
 head.innerHTML="";
 ["CODIGO","APELLIDOS Y NOMBRES","CEDULA","TELEFONO","DIRECCION","CURSO","FALTAS","DEBE $"].forEach(t=>{
  let th=document.createElement("th");th.innerText=t;head.appendChild(th)
 });
 for(let i=0;i<24;i++){
  let th=document.createElement("th");th.innerHTML="SEM "+(i+1)+"<br><small>"+(fechas[i]||"")+"</small>";head.appendChild(th)
 }
 body.innerHTML="";
 alumnos.filter(a=>a.horario==hAct).forEach(al=>{
  let gi=alumnos.indexOf(al);
  let faltas=al.semanas.filter(s=>s.asist=="NO").length;
  let debe=al.semanas.filter(s=>!s.valor).length*5;
  let tr=document.createElement("tr");
  tr.innerHTML=`<td><input value="${al.codigo}" onchange="alumnos[${gi}].codigo=this.value"></td>
  <td class="fijo"><input value="${al.apellidos}" style="text-align:left" onchange="alumnos[${gi}].apellidos=this.value"></td>
  <td><input value="${al.cedula}" onchange="alumnos[${gi}].cedula=this.value"></td>
  <td><input value="${al.telefono}" onchange="alumnos[${gi}].telefono=this.value"></td>
  <td><input value="${al.direccion}" onchange="alumnos[${gi}].direccion=this.value"></td>
  <td><input value="${al.curso}" onchange="alumnos[${gi}].curso=this.value"></td>
  <td style="color:red;font-weight:bold">${faltas}</td>
  <td style="color:red;font-weight:bold">$${debe}</td>`;
  al.semanas.forEach((s,si)=>{
   let td=document.createElement("td");
   td.innerHTML=<input placeholder="fecha" value="${s.fecha}" onchange="alumnos[${gi}].semanas[${si}].fecha=this.value" style="font-size:10px;border-bottom:1px solid #eee"><select onchange="alumnos[${gi}].semanas[${si}].asist=this.value;render()"><option value="">-</option><option ${s.asist=="SI"?"selected":""}>SI</option><option ${s.asist=="NO"?"selected":""}>NO</option></select><input placeholder="$" value="${s.valor}" onchange="alumnos[${gi}].semanas[${si}].valor=this.value;render()" style="border-top:1px solid #eee">;
   tr.appendChild(td)
  });
  body.appendChild(tr)
 });
 tit.innerText="FEDECOMPU - "+hAct+" ("+alumnos.filter(a=>a.horario==hAct).length+" alumnos)";
}
function agregar(){alumnos.push({codigo:String(alumnos.length+1).padStart(3,"0"),apellidos:"NUEVO ALUMNO",cedula:"",telefono:"",direccion:"",curso:"BASICO",horario:hAct,semanas:Array(24).fill(0).map(()=>({fecha:"",asist:"",valor:""}))});guardar()}
function guardar(){localStorage.setItem("fede_final_2018",JSON.stringify(alumnos));localStorage.setItem("fechas_"+hAct,JSON.stringify(fechas));estado.innerText="✓ Guardado correctamente";setTimeout(()=>estado.innerText="",2000);init()}
function exportar(){let csv="CODIGO,APELLIDOS Y NOMBRES,CEDULA,TELEFONO,DIRECCION,CURSO,HORARIO,"+fechas.map((f,i)=>"SEM"+(i+1)+""+f).join(",")+"\n";alumnos.filter(a=>a.horario==hAct).forEach(a=>{csv+=${a.codigo},"${a.apellidos}",${a.cedula},${a.telefono},"${a.direccion}",${a.curso},${a.horario},${a.semanas.map(s=>s.fecha+"|"+s.asist+"|"+s.valor).join(",")}\n});let b=new Blob([csv],{type:"text/csv"});let l=document.createElement("a");l.href=URL.createObjectURL(b);l.download="FEDECOMPU"+hAct+"_fedecompu2018.csv";l.click()}
</script>
</body>
</html>
